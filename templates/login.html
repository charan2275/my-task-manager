{% extends "base.html" %}
{% block title %}Login | My Task Manager{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="brand-large"><span class="brand-mark">✓</span></div>
        <h1>Welcome back</h1>
        <p class="text-muted mb-4">Log in to manage your daily tasks.</p>
        <form method="post">
            <label class="form-label">Email address</label>
            <input class="form-control form-control-lg mb-3" type="email" name="email" placeholder="you@example.com" required>

            <label class="form-label">Password</label>
            <input class="form-control form-control-lg mb-4" type="password" name="password" placeholder="Enter your password" required>

            <button class="btn btn-primary btn-lg w-100">Login</button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
